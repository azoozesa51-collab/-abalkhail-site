<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محرر محل بدر أبا الخيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: أداة عملية هادئة، زي محررات التصميم الداخلي
   IDEA: مجسم المحل نفسه هو لوحة العمل، تحرّك القطع بإصبعك
   PICTURE: المشهد ثلاثي الأبعاد يعبّي الشاشة كلها
   COLOUR and TYPE: أخضر الهوية ‎#12372A وأبيض؛ IBM Plex Sans Arabic، وخط Reem Kufi للشعار
   LAYOUT: شريط أدوات فوق، ولوحة القطعة المحددة تحت */
:root{--g:#12372A;--g2:#1c4a39}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#d9cdb9;font:15px/1.5 "IBM Plex Sans Arabic",system-ui,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bar{position:fixed;top:10px;right:10px;left:10px;display:flex;gap:8px;align-items:center;background:rgba(18,55,42,.92);backdrop-filter:blur(6px);border-radius:14px;padding:6px;overflow-x:auto;scrollbar-width:none}
.brand{flex:none;font:700 16px "Reem Kufi",sans-serif;padding:0 8px;white-space:nowrap}
button{font:600 14px "IBM Plex Sans Arabic",sans-serif;color:#fff;background:rgba(255,255,255,.1);border:0;border-radius:10px;min-height:44px;padding:0 12px;cursor:pointer;white-space:nowrap;flex:none}
button:hover{background:rgba(255,255,255,.18)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.on{background:#fff;color:var(--g)}
button.danger{background:#7a2020}
button:disabled{opacity:.4;cursor:default}
.panel{position:fixed;bottom:10px;right:10px;left:10px;max-width:760px;margin-inline:auto;background:rgba(18,55,42,.95);backdrop-filter:blur(6px);border-radius:16px;padding:12px;display:grid;gap:10px;max-height:46vh;overflow:auto}
.panel[hidden],.sheet[hidden]{display:none}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row b{font-size:15px;margin-inline-end:auto}
.lbl{font-size:13px;opacity:.85;min-width:70px}
input[type=range]{flex:1;min-width:140px;accent-color:#fff;height:44px}
input[type=text],textarea{font:16px "IBM Plex Sans Arabic",sans-serif;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.2);color:#fff;padding:8px 10px;flex:1}
textarea{width:100%;min-height:120px;direction:ltr;font-size:13px}
.val{font-size:13px;min-width:52px;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--g),0 0 0 4px #fff}
.sheet{position:fixed;inset:auto 10px 10px 10px;max-width:760px;margin-inline:auto;background:rgba(18,55,42,.97);border-radius:16px;padding:14px;display:grid;gap:12px;max-height:72vh;overflow:auto}
.sheet h2{margin:0;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid button{min-height:64px;white-space:normal;line-height:1.3}
.note{font-size:12px;opacity:.75;margin:0}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:6px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);padding:5px 14px;border-radius:999px;font-size:13px;white-space:nowrap;pointer-events:none}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--g);font:600 18px "IBM Plex Sans Arabic",sans-serif;transition:opacity .5s;z-index:5}
#load.off{opacity:0;pointer-events:none}
.sync{flex:none;font-size:12px;opacity:.85;padding:0 8px;white-space:nowrap}
#aiBtn{background:#fff;color:var(--g)}
.chat{display:grid;gap:8px;max-height:38vh;overflow:auto;padding:2px}
.msg{padding:8px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;font-size:15px}
.msg.user{background:#fff;color:var(--g);justify-self:start}
.msg.assistant{background:rgba(255,255,255,.12);justify-self:end}
.chips button{min-height:36px;font-size:13px;font-weight:400}
@media(max-width:600px){.brand{display:none}#hint{font-size:12px}}
</style>
</head>
<body>
<canvas id="c" aria-label="محرر ثلاثي الأبعاد لمحل بدر أبا الخيل"></canvas>
<header class="bar">
  <span class="brand">محرر محل بدر أبا الخيل</span>
  <button id="aiBtn" type="button" hidden>✨ مساعد AI</button>
  <button id="undo" type="button" disabled>↶ تراجع</button>
  <button id="addBtn" type="button">+ إضافة قطعة</button>
  <button id="roomBtn" type="button">الغرفة</button>
  <button id="viewBtn" type="button">منظر علوي</button>
  <button id="snapBtn" type="button" class="on">مغناطيس الشبكة</button>
  <button id="nightBtn" type="button">وضع المساء</button>
  <button id="moreBtn" type="button">حفظ وتصدير</button>
  <span id="sync" class="sync" hidden></span>
</header>
<section id="sel" class="panel" hidden></section>
<section id="sheet" class="sheet" hidden></section>
<div id="hint">اضغط على أي قطعة عشان تعدّلها · اسحبها لتحريكها · اسحب الفراغ للتدوير</div>
<div id="toast"></div>
<div id="load">جاري تجهيز المحرر…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const loadEl=$('#load');
try{
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const DAY_BG=0xd9cdb9,NIGHT_BG=0x15181c;scene.background=new THREE.Color(DAY_BG);
const camera=new THREE.PerspectiveCamera(55,1,.05,150);
const maxAniso=renderer.capabilities.getMaxAnisotropy();
const C=h=>new THREE.Color(h).convertSRGBToLinear();
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const R0=rng(7),rnd=(a,b,R=R0)=>a+R()*(b-a);

// ===== الخامات =====
function canvasTex(w,h,draw,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;
}
const woodTex=canvasTex(256,512,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);
  for(let i=0;i<220;i++){const x=R0()*w;g.strokeStyle=`rgba(0,0,0,${rnd(.04,.15)})`;g.lineWidth=rnd(.5,3);g.beginPath();g.moveTo(x,0);let xx=x;for(let y=0;y<=h;y+=16){xx+=rnd(-1.2,1.2);g.lineTo(xx,y);}g.stroke();}});
const fabricTex=canvasTex(128,128,(g,w)=>{g.fillStyle='#fff';g.fillRect(0,0,w,w);g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=3;
  for(let i=-w;i<w*2;i+=16){g.beginPath();g.moveTo(i,0);g.lineTo(i+w,w);g.stroke();g.beginPath();g.moveTo(i,w);g.lineTo(i+w,0);g.stroke();}},[3,3]);
const plasterTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);
  for(let i=0;i<1800;i++){g.fillStyle=`rgba(${R0()<.5?'255,255,255':'120,100,80'},${rnd(.02,.08)})`;g.fillRect(R0()*w,R0()*h,rnd(1,5),rnd(1,5));}},[3,1.5]);
const FLOORS={
  herring:{name:'باركيه سنبلة',tile:1.3,tex:canvasTex(512,512,(g,w)=>{
    const u=w/8,L=4*u,Wd=u,tones=['#c99a66','#d4a874','#bd8b58','#c7955f','#d9b07d','#b88452','#cfa16c','#c08e5b'];
    const tH=[],tV=[];for(let i=0;i<8;i++){tH.push(tones[Math.floor(R0()*8)]);tV.push(tones[Math.floor(R0()*8)]);}
    const pl=(x,y,pw,ph,col)=>{g.fillStyle=col;g.fillRect(x,y,pw,ph);g.strokeStyle='rgba(85,52,22,.55)';g.lineWidth=1.5;g.strokeRect(x+.75,y+.75,pw-1.5,ph-1.5);};
    for(let k=-5;k<=5;k++)for(let i=-24;i<=24;i++){const c=(((i-4*k)%8)+8)%8,ox=k*L+i*Wd,oy=-k*L+i*Wd;pl(ox,oy,L,Wd,tH[c]);pl(ox,oy+Wd,Wd,L,tV[c]);}
  },[1,1])},
  marble:{name:'رخام بيج',tile:1.2,tex:canvasTex(512,512,(g,w)=>{g.fillStyle='#e8dfd0';g.fillRect(0,0,w,w);
    for(let i=0;i<40;i++){g.strokeStyle=`rgba(150,125,95,${rnd(.08,.25)})`;g.lineWidth=rnd(.5,2.5);g.beginPath();let x=R0()*w,y=R0()*w;g.moveTo(x,y);for(let k=0;k<12;k++){x+=rnd(-40,40);y+=rnd(-40,40);g.lineTo(x,y);}g.stroke();}
    g.strokeStyle='rgba(120,100,80,.35)';g.lineWidth=2;g.strokeRect(0,0,w,w);},[1,1])},
  concrete:{name:'أسمنت مصقول',tile:2,tex:canvasTex(256,256,(g,w)=>{g.fillStyle='#b9b3aa';g.fillRect(0,0,w,w);
    for(let i=0;i<3000;i++){g.fillStyle=`rgba(${R0()<.5?'255,255,255':'60,55,50'},${rnd(.02,.07)})`;g.fillRect(R0()*w,R0()*w,rnd(1,4),rnd(1,4));}},[1,1])}
};
const mats={};
const keep=m=>{m.userData.keep=true;return m;};
const woodMat=h=>mats['w'+h]||(mats['w'+h]=keep(new THREE.MeshStandardMaterial({map:woodTex,color:C(h),roughness:.55})));
const colMat=(h,r=.6)=>mats['c'+h+r]||(mats['c'+h+r]=keep(new THREE.MeshStandardMaterial({color:C(h),roughness:r})));
const metalMat=h=>mats['m'+h]||(mats['m'+h]=keep(new THREE.MeshStandardMaterial({color:C(h),metalness:1,roughness:.25})));
const glowMat=h=>mats['g'+h]||(mats['g'+h]=keep(new THREE.MeshStandardMaterial({color:C(h),emissive:C(h),emissiveIntensity:1.2})));
const fabMat=h=>mats['f'+h]||(mats['f'+h]=keep(new THREE.MeshStandardMaterial({map:fabricTex,color:C(h),roughness:.95})));
const M={
  glass:new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.14,roughness:.05,metalness:.3,depthWrite:false,side:THREE.DoubleSide}),
  chips:new THREE.MeshStandardMaterial({color:C('#3b2416'),roughness:.4,flatShading:true}),
  gold:new THREE.MeshStandardMaterial({color:C('#d4a64a'),metalness:1,roughness:.22,side:THREE.DoubleSide}),
  white:colMat('#f4f1ea',.35),whiteD:new THREE.MeshStandardMaterial({color:C('#f4f1ea'),roughness:.35,side:THREE.DoubleSide}),
  chrome:new THREE.MeshStandardMaterial({color:0xdddddd,metalness:1,roughness:.2}),black:new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.3,metalness:.4}),
  amber:new THREE.MeshStandardMaterial({color:C('#6b3a1a'),roughness:.12,transparent:true,opacity:.88}),
  gap:colMat('#3a2010',.8),trav:colMat('#d8ccb5',.8),stick:colMat('#3a2a1c',.8),flower:colMat('#e6d5b5',.9),
  led:new THREE.MeshStandardMaterial({color:0xffe2b0,emissive:0xffd59a,emissiveIntensity:.8}),
  down:new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff3dd,emissiveIntensity:1.2}),
  frame:new THREE.MeshStandardMaterial({color:0x2a2a28,roughness:.5,metalness:.6}),
  ceiling:colMat('#efe6d8',1),ground:colMat('#cdbb9d',1),bldg:colMat('#e6dccb',1),
  wall:new THREE.MeshStandardMaterial({map:plasterTex,roughness:.95}),
  floor:new THREE.MeshStandardMaterial({roughness:.55})
};
for(const k in M)M[k].userData.keep=true;for(const k in mats)mats[k].userData.keep=true;

// أشكال مشتركة
const G={bottleW:new THREE.CylinderGeometry(.035,.035,.11,16),bottleD:new THREE.BoxGeometry(.06,.1,.06),cap:new THREE.CylinderGeometry(.022,.022,.04,12),
  capG:new THREE.CylinderGeometry(.018,.018,.03,12),jar:new THREE.CylinderGeometry(.045,.05,.12,16),stick:new THREE.CylinderGeometry(.003,.003,.26,4),
  boxW:new THREE.BoxGeometry(.16,.06,.1),chip:new THREE.IcosahedronGeometry(.028,0),flute:new THREE.CylinderGeometry(.036,.036,1,12)};
const GM={bottleW:'white',bottleD:'amber',cap:'black',capG:'gold',jar:'white',stick:'stick',boxW:'white',chip:'chips'};
for(const k in G)G[k].userData.keep=true;

// ===== أدوات البناء =====
function B(p,w,h,d,mat,x,y,z,cast=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;p.add(m);return m;}
const tmp=new THREE.Object3D();
function newColl(){const L={};for(const k in GM)L[k]=[];return L;}
function put(L,n,x,y,z,ry=0,s=1,rx=0,rz=0){tmp.position.set(x,y,z);tmp.rotation.set(rx,ry,rz);tmp.scale.setScalar(s);tmp.updateMatrix();L[n].push(tmp.matrix.clone());}
function flush(L,g){for(const k in L){if(!L[k].length)continue;const im=new THREE.InstancedMesh(G[k],M[GM[k]],L[k].length);
  L[k].forEach((m,i)=>im.setMatrixAt(i,m));im.castShadow=im.receiveShadow=true;im.frustumCulled=false;g.add(im);}}

// ===== أنواع القطع =====
const WOODS=[['#9a5a30','جوز'],['#c9a06a','بلوط فاتح'],['#5a3420','خشب داكن'],['#e8e2d8','أبيض']];
const ACCENTS=[['#1d3a2b','أخضر الهوية'],['#1f2d44','كحلي'],['#1b1b1b','أسود'],['#cdb89a','بيج'],['#5a1f24','عنابي']];
const WALLS=[['#e9dfcf','بيج'],['#f3efe8','أبيض دافئ'],['#d6c4ad','رملي'],['#c9cfc4','رمادي مخضر'],['#3b3530','داكن']];

function fillBay(L,R,xa,xb,y,z){const t=Math.floor(R()*4);
  if(t===0){for(let i=0;i<3;i++){const x=xa+(xb-xa)*(i+.5)/3;put(L,'bottleW',x,y+.055,z);put(L,'cap',x,y+.13,z);}}
  else if(t===1){for(let i=0;i<2;i++){const x=xa+(xb-xa)*(i+.5)/2;put(L,'jar',x,y+.06,z);for(let s=0;s<5;s++)put(L,'stick',x+rnd(-.012,.012,R),y+.2,z+rnd(-.012,.012,R),0,1,rnd(-.25,.25,R),rnd(-.25,.25,R));}}
  else if(t===2){const x=(xa+xb)/2;for(let s=0;s<3;s++)put(L,'boxW',x,y+.03+s*.062,z,rnd(-.12,.12,R));}
  else{for(let i=0;i<4;i++){const x=xa+(xb-xa)*(i+.5)/4;put(L,'bottleD',x,y+.05,z);put(L,'capG',x,y+.115,z);}}
}
const DEFS={
  shelf:{name:'رف جداري',w:2.4,minW:.6,maxW:7,dep:.44,wall:1,acc:1,build(it,g){
    const R=rng(it.id*977),width=it.w,dep=.42,top=Math.min(2.75,state.room.H-.2),cab=.75,z0=-.21,wood=woodMat(it.wood);
    const bays=Math.max(1,Math.round(width/.9)),bw=width/bays,L=newColl();
    B(g,width,top,.02,colMat(it.accent,.75),0,top/2,z0+.01,false);
    for(let i=0;i<=bays;i++)B(g,.04,top,dep,wood,-width/2+i*bw,top/2,0);
    B(g,width+.04,.05,dep,wood,0,top,0);B(g,width,cab,dep+.04,wood,0,cab/2,.02);
    for(let i=0;i<bays;i++){const x=-width/2+(i+.5)*bw;B(g,bw-.05,.008,.006,M.gap,x,cab/2,z0+dep+.043,false);B(g,.008,cab-.06,.006,M.gap,x,cab/2,z0+dep+.043,false);}
    for(let n=0;cab+n*.4<top-.15;n++){const y=cab+n*.4;
      if(n>0){B(g,width,.03,dep,wood,0,y,0);B(g,width-.1,.012,.015,M.led,0,y-.022,z0+dep-.04,false);}
      for(let b=0;b<bays;b++){const x0=-width/2+b*bw;fillBay(L,R,x0+.08,x0+bw-.08,y+(n>0?.015:0),0);}}
    flush(L,g);}},
  island:{name:'طاولة عرض بخور',w:2.4,minW:.9,maxW:4,dep:.9,build(it,g){
    const R=rng(it.id*331),len=it.w,wid=.9,h=.9,wood=woodMat(it.wood),L=newColl();
    B(g,len,h-.06,wid,wood,0,(h-.06)/2,0);
    const nf=Math.floor(len/.075),fg=new THREE.BoxGeometry(.045,h-.1,.035);
    for(let i=0;i<nf;i++)for(const s of[-1,1]){const m=new THREE.Mesh(fg,wood);m.position.set(-len/2+(i+.5)*len/nf,(h-.1)/2,s*(wid/2+.017));m.castShadow=m.receiveShadow=true;g.add(m);}
    B(g,len+.06,.04,wid+.06,wood,0,h-.04,0);
    const n=Math.max(1,Math.round(len/.8)),tl=len/n,mid=Math.floor(n/2),em=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.45});
    for(let k=0;k<n;k++){const tx=-len/2+tl*(k+.5),gh=k===mid?.36:.2;
      for(let c=0;c<(k===mid?100:200);c++)put(L,'chip',tx+rnd(-(tl-.12)/2,(tl-.12)/2,R),h+.005+R()*.05,rnd(-(wid-.14)/2,(wid-.14)/2,R),R()*6,rnd(.7,1.5,R),R()*6,R()*6);
      const geo=new THREE.BoxGeometry(tl-.06,gh,wid-.06),gb=new THREE.Mesh(geo,M.glass);gb.position.set(tx,h+gh/2,0);g.add(gb);
      const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),em);e.position.copy(gb.position);g.add(e);
      if(k===mid){const st=new THREE.Mesh(new THREE.CylinderGeometry(.02,.05,.17,20),M.gold);st.position.set(tx,h+.085,0);g.add(st);
        const bw=new THREE.Mesh(new THREE.SphereGeometry(.13,28,14,0,Math.PI*2,Math.PI/2,Math.PI/2),M.gold);bw.position.set(tx,h+.29,0);bw.castShadow=true;g.add(bw);
        for(let c=0;c<35;c++){const a=R()*6.28,r=R()*.1;put(L,'chip',tx+Math.cos(a)*r,h+.21+R()*.06,Math.sin(a)*r,R()*6,1,R()*6,R()*6);}}}
    flush(L,g);}},
  counter:{name:'كاونتر استقبال',w:1.8,minW:.8,maxW:4,dep:.7,acc:1,build(it,g){
    const len=it.w,dep=.6,h=1,wood=woodMat(it.wood),L=newColl();
    B(g,len,h-.05,dep,wood,0,(h-.05)/2,0);
    const n=Math.floor(len/.072);for(let i=0;i<n;i++){const m=new THREE.Mesh(G.flute,wood);m.scale.y=h-.08;m.position.set(-len/2+(i+.5)*len/n,(h-.08)/2,dep/2+.012);m.castShadow=m.receiveShadow=true;g.add(m);}
    B(g,len+.08,.05,dep+.1,colMat(it.accent,.35),0,h-.025,0);
    const v=new THREE.Mesh(new THREE.SphereGeometry(.09,20,14),M.white);v.scale.set(1,1.6,1);v.position.set(len/2-.3,h+.14,0);v.castShadow=true;g.add(v);
    for(let s=0;s<6;s++)put(L,'stick',len/2-.3,h+.36,0,0,1.4,(s-2.5)*.1,(s%3-1)*.15);flush(L,g);}},
  chair:{name:'كرسي',dep:.7,acc:1,build(it,g){const wood=woodMat(it.wood),f=fabMat(it.accent);
    B(g,.74,.06,.66,wood,0,.33,0);B(g,.6,.12,.6,f,0,.42,.02);B(g,.6,.5,.12,f,0,.72,-.25);for(const s of[-1,1])B(g,.07,.66,.68,wood,s*.335,.33,0);}},
  table:{name:'طاولة جانبية',dep:.5,build(it,g){const R=rng(it.id*53);
    const t=new THREE.Mesh(new THREE.CylinderGeometry(.22,.24,.55,32),M.trav);t.position.y=.275;t.castShadow=t.receiveShadow=true;g.add(t);
    const v=new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,.18,20),M.white);v.position.y=.64;v.castShadow=true;g.add(v);

  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);

لا تحرّك ولا تحذف ولا تضيف أي قطعة إلا إذا الطلب يقول ذلك صراحة. إذا الطلب تغيير لون أو خامة أو مقاس، عدّل هذا الحقل بس وخلّ المواقع والاتجاهات كما هي (لا تمرر x أو z أو rot_deg). للتعديل على كل القطع من نوع واحد استخدم update_items مرة وحدة. خشب داكن = #5a3420.

  <p class="note">كل اللي يسويه Gemini في طلب واحد ترجعه بضغطة تراجع وحدة.</p>`);aiOpen=true;renderChat();}
function toGem(s){if(!s||typeof s!=='object')return s;const o={};
  for(const k of['type','description','enum','properties','items','required']){if(s[k]===undefined)continue;
    if(k==='type')o.type=String(s.type).toUpperCase();
    else if(k==='properties'){o.properties={};for(const p in s.properties)o.properties[p]=toGem(s.properties[p]);}
    else if(k==='items')o.items=toGem(s.items);else o[k]=s[k];}
  return o;}
const GEM_TOOLS=[{functionDeclarations:AI_TOOLS.map(t=>{const d={name:t.name,description:t.description};
  if(t.inputSchema&&t.inputSchema.properties&&Object.keys(t.inputSchema.properties).length)d.parameters=toGem(t.inputSchema);return d;})}];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function gemCall(contents,onWait){
  const key=LS('gemini-key'),chosen=(LS('gemini-model')||DEFAULT_MODEL).replace(/^models\//,'');
  const chain=[chosen,...['gemini-3.8-flash','gemini-3.5-flash','gemini-3.5-flash-lite'].filter(m=>m!==chosen)];
  let lastErr=null;
  for(let mi=0;mi<chain.length;mi++){const model=chain[mi];
    for(let attempt=0;attempt<2;attempt++){
      let res;
      try{res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',
        headers:{'Content-Type':'application/json','x-goog-api-key':key},
        body:JSON.stringify({systemInstruction:{parts:[{text:aiPrompt()}]},contents,tools:GEM_TOOLS})});}
      catch(e){throw new Error('ما قدرت أوصل لخوادم Google. إذا فاتح الصفحة داخل Claude فهي تمنع الاتصال، افتح نسخة الملف على موقعك أو من جهازك.');}
      let j={};try{j=await res.json();}catch(e){}
      if(res.ok)return j;
      const m=(j.error&&j.error.message)||res.statusText;
      if(res.status===400&&/API key/i.test(m))throw new Error('مفتاح Gemini غير صحيح.');
      if(res.status===429)throw new Error('وصلت حد الاستخدام في Gemini، جرّب بعد شوي.');
      if(res.status===404){lastErr=new Error('الموديل "'+model+'" مو موجود. اضغط "جيب الموديلات" واختار واحد.');break;}
      if(res.status>=500){lastErr=new Error('خوادم Gemini مشغولة حالياً (ضغط عالي). جرّب بعد دقيقة.');
        if(attempt===0){if(onWait)onWait('الموديل مشغول، أعيد المحاولة…');await sleep(2500);continue;}break;}
      throw new Error('Gemini: '+m);
    }
    if(mi<chain.length-1&&onWait)onWait('أجرّب موديل ثاني ('+chain[mi+1]+')…');
  }
  throw lastErr||new Error('ما قدرت أوصل لـ Gemini.');}
async function askAI(text){
  text=text.trim();if(!text||aiBusy)return;
  if(!LS('gemini-key')){toast('أدخل مفتاح Gemini أول');const d=sheet.querySelector('details');if(d)d.open=true;return;}
  aiBusy=true;const before=JSON.stringify(state);hist.push(before);undoBtn.disabled=false;
  chat.push({role:'user',content:text},{role:'assistant',content:'يفكر…'});const last=chat[chat.length-1];renderChat();
  if(gem.length>80)gem=[];
  gem.push({role:'user',parts:[{text}]});
  try{
    for(let round=0;round<15;round++){
      const r=await gemCall(gem,w=>{last.content=w;renderChat();});const cand=r.candidates&&r.candidates[0];
      if(!cand||!cand.content||!cand.content.parts){throw new Error(r.promptFeedback&&r.promptFeedback.blockReason?'Gemini رفض الطلب ('+r.promptFeedback.blockReason+')':'Gemini ما رجّع رد.');}
      gem.push(cand.content);
      const calls=cand.content.parts.filter(p=>p.functionCall);
      const said=cand.content.parts.filter(p=>p.text&&!p.thought).map(p=>p.text).join('').trim();
      if(said)last.content=said;
      if(!calls.length){if(!said)last.content='خلصت.';break;}
      const parts=calls.map(p=>{const fc=p.functionCall,t=AI_TOOLS.find(x=>x.name===fc.name);let out;
        try{out=t?t.execute(fc.args||{}):{error:'أداة غير معروفة'};}catch(e){out={error:e.message};}
        const fr={name:fc.name,response:{result:out}};if(fc.id)fr.id=fc.id;return{functionResponse:fr};});
      gem.push({role:'user',parts});
      if(!said)last.content='يشتغل على التصميم…';renderChat();
    }
  }catch(e){last.content=e.message||'صار خطأ.';
    while(gem.length&&gem[gem.length-1].role==='user'&&gem[gem.length-1].parts.some(p=>p.functionResponse))gem.pop();
    if(gem.length&&gem[gem.length-1].role==='user')gem.pop();}
  aiBusy=false;
  if(JSON.stringify(state)===before){hist.pop();undoBtn.disabled=!hist.length;}else{save();showSel();}
  renderChat();
}
sheet.addEventListener('submit',e=>{e.preventDefault();const i=$('#aiI');if(i){const v=i.value;i.value='';askAI(v);}});
sheet.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ex){askAI(b.dataset.ex);return;}
  const a=b.dataset.a;
  if(a==='gSave'){LS('gemini-key',$('#gKey').value.trim());LS('gemini-model',$('#gModel').value.trim()||DEFAULT_MODEL);gem=[];toast('انحفظت إعدادات Gemini');const d=sheet.querySelector('details');if(d)d.open=false;return;}
  if(a==='gDel'){try{localStorage.removeItem('gemini-key');}catch(err){}$('#gKey').value='';toast('انحذف المفتاح');return;}
  if(a==='gList'){const key=$('#gKey').value.trim();if(!key){toast('أدخل المفتاح أول');return;}
    try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':key}});const j=await r.json();
      if(!r.ok)throw new Error((j.error&&j.error.message)||'خطأ');
      const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''));
      $('#gModels').innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('');toast('لقيت '+names.length+' موديل، اختار من القائمة');}
    catch(err){toast(/fetch/i.test(String(err))?'الاتصال بـ Google محجوب هنا':'ما قدرت أجيب الموديلات');}}
});
$('#aiBtn').onclick=openAI;$('#aiBtn').hidden=false;$('#aiBtn').textContent='✨ Gemini';

// ===== المزامنة مع السحابة (عشان Claude يقرأ ويعدّل التصميم من المحادثة) =====
const syncEl=$('#sync');const setSync=t=>{syncEl.hidden=false;syncEl.textContent='☁︎ '+t;};
let dbDoc=null,lastRev=null,pushT=null,writing=false,again=false;
var pushRemote=function(){if(!dbDoc)return;clearTimeout(pushT);pushT=setTimeout(doPush,900);};
async function doPush(){if(!dbDoc)return;if(writing){again=true;return;}writing=true;
  const rev=Date.now().toString(36)+Math.random().toString(36).slice(2,6);lastRev=rev;
  try{await dbDoc.set({state:JSON.parse(JSON.stringify(state)),rev,by:'page',updatedAt:new Date().toISOString()});setSync('محفوظ');}
  catch(e){if(e&&e.code==='invalid_argument'){dbDoc=null;setSync('للعرض فقط');}else setSync('تعذّر الحفظ');}
  writing=false;if(again){again=false;doPush();}}
(async()=>{let db=null;try{db=await claude.use('db');}catch(e){}if(!db)return;
  const ref=db.doc('design/current');setSync('جاري الاتصال…');
  const timer=setTimeout(()=>setSync('السحابة ما ردّت'),10000);
  ref.onSnapshot(s=>{
    if(!s.metadata.fromCache)clearTimeout(timer);
    if(!dbDoc&&!s.metadata.fromCache){dbDoc=ref;if(!s.exists){doPush();return;}}
    if(!s.exists||s.metadata.hasPendingWrites)return;
    const d=s.data();if(!d||d.rev===lastRev)return;
    const st=d.state&&JSON.parse(JSON.stringify(d.state));if(!st||!st.room||!Array.isArray(st.items))return;
    st.items=st.items.map(norm).filter(Boolean);st.nextId=Math.max(+st.nextId||0,...st.items.map(i=>i.id+1),1);
    lastRev=d.rev;const firstLoad=!s.metadata.fromCache&&!hist.length;
    if(JSON.stringify(st)!==JSON.stringify(state)){if(!firstLoad)snapshot();state=st;if(!getIt(selId))selId=null;rebuildAll();showSel();saveLocal();if(!firstLoad)toast(d.by==='claude'?'Claude عدّل التصميم':'انحدّث التصميم');}
    setSync('متصل');
  },()=>{clearTimeout(timer);setSync('السحابة غير متاحة');});
})();

// ===== التشغيل =====
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<600?68:55;camera.updateProjectionMatrix();}
const ro=new ResizeObserver(resize);ro.observe(canvas);resize();
rebuildAll();showSel();
if(document.fonts&&document.fonts.load)document.fonts.load('700 150px "Reem Kufi"').then(()=>state.items.filter(i=>i.type==='logo').forEach(buildItem)).catch(()=>{});
let first=true;
function loop(){
  if(goal){const k=.1;cur.theta+=(goal.theta-cur.theta)*k;cur.phi+=(goal.phi-cur.phi)*k;cur.r+=(goal.r-cur.r)*k;cur.t.lerp(goal.t,k);
    if(Math.abs(goal.r-cur.r)<.005&&Math.abs(goal.phi-cur.phi)<.002)goal=null;}
  applyCam();renderer.render(scene,camera);
  if(first){first=false;loadEl.classList.add('off');}
  requestAnimationFrame(loop);
}
loop();
}catch(err){loadEl.textContent='المتصفح ما يدعم العرض الثلاثي الأبعاد (WebGL).';console.error(err);}
}
